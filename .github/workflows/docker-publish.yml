# Builds and pushes the backend and frontend images to GitHub Container Registry.
#
# Replaces the manual `build_docker_image_*` jobs that pushed to the GitLab
# registry in the previous incarnation of this project.
#
# Consume the published images by setting these in the server's .env:
#   BACKEND_IMAGE=ghcr.io/<owner>/aidef-backend:latest
#   FRONTEND_IMAGE=ghcr.io/<owner>/aidef-frontend:latest
# then `docker compose -f docker-compose.prod.yml pull && ... up -d`.
# Prefer pinning to a :sha-<commit> tag over :latest so rollbacks are possible.

name: Publish images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build-args: ''
          - name: frontend
            context: .
            dockerfile: ./Dockerfile
            # The published frontend image is the one that runs behind Traefik,
            # so it must be built with the proxied (plain HTTP) nginx config.
            build-args: NGINX_CONF=frontend/nginx.proxied.conf

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/aidef-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix['build-args'] }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

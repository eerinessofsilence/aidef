services:
  db:
    image: postgres:16-alpine
    container_name: aidef-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-aidef}
      POSTGRES_USER: ${POSTGRES_USER:-aidef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidef}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidef-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-db}
    depends_on:
      - db
    volumes:
      - static_volume:/app/static
      - ./backend/media:/app/media
    
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidef-web
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/static
    
volumes:
  postgres_data:
  static_volume:

  <path d="M96 106C91 47 124 19 168 20c34 1 55 23 59 59-21-6-42-20-55-37-16 25-41 39-76 42Z" fill="#684536"/>
  <path d="M107 110h39m22 0h37m-59 2 10 1" fill="none" stroke="#4c5b6b" stroke-width="4"/>
  <circle cx="126" cy="111" r="21" fill="none" stroke="#4c5b6b" stroke-width="4"/><circle cx="178" cy="111" r="21" fill="none" stroke="#4c5b6b" stroke-width="4"/>
  <circle cx="127" cy="113" r="4" fill="#293649"/><circle cx="178" cy="113" r="4" fill="#293649"/>
  <path d="M143 145c9 7 19 7 28 0" fill="none" stroke="#a74e4a" stroke-width="5" stroke-linecap="round"/>
  <!-- Torso -->
  <path d="M101 194c-33 7-51 29-56 67L32 455h250l-14-194c-4-38-23-60-56-67l-55 45Z" fill="#72513f"/>
  <path d="M117 203c21-13 58-13 80 0l24 252H95Z" fill="#f4eee5"/>
  <path d="m126 221 31 30 32-30-5 234h-57Z" fill="#a66b49"/>
  <!-- Left sleeve and connected forearm -->
  <path d="M88 211c-29 5-45 23-53 51l-21 65 39 15 42-58 25-50Z" fill="#72513f"/>
  <path d="m26 316-26 30c-7 8-4 18 4 20l18-9-8 18c-3 8 5 13 12 8l15-16 4 15c2 8 12 7 14-1l2-30-14-25Z" fill="#e5aa83" stroke="#c58768" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right sleeve, forearm and open hand -->
  <path d="M207 211c29 5 45 23 53 51l21 65-39 15-42-58-25-50Z" fill="#72513f"/>
  <path d="m270 316 27 25c8 7 7 17-1 21l-18-7 10 17c4 7-3 14-10 10l-17-14-1 15c0 9-10 10-14 2l-7-29 10-27Z" fill="#e5aa83" stroke="#c58768" stroke-width="4" stroke-linejoin="round"/>
  <path d="M57 455h198" stroke="#4a3b35" stroke-width="10" stroke-linecap="round"/>
</g>

<!-- Little classroom mascot -->
<g transform="translate(1470 35) rotate(7 43 52)">
  <rect x="8" y="8" width="70" height="98" rx="12" fill="#d6b88e" stroke="#816d58" stroke-width="5"/><rect x="15" y="19" width="56" height="77" rx="8" fill="#fff8e9" stroke="#b29a79" stroke-width="3"/><rect x="29" y="1" width="28" height="14" rx="6" fill="#9d8769"/>
  <circle cx="34" cy="51" r="4.5" fill="#293649"/><circle cx="53" cy="51" r="4.5" fill="#293649"/><path d="M34 68c6 8 14 8 20 0" fill="none" stroke="#d86f57" stroke-width="4" stroke-linecap="round"/><path d="M7 56C-5 49-8 39-4 30m84 24c10-7 12-16 8-25" fill="none" stroke="#816d58" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
